<title>Hikâye İncelemesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one column per story, each page a numbered row (picture, sentence, play buttons, choices). */
:root{--bg:#F5FAFD;--card:#FFFFFF;--fg:#18334B;--soft:#526E83;--line:#DCEAF2;--accent:#FF8A32;--ok:#10B7B0;--no:#B9C9D4;--btn:#E5F4FF;--btnfg:#0868AF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1D29;--card:#16293A;--fg:#E6F0F7;--soft:#A9BFCF;--line:#29404F;--btn:#1E3A52;--btnfg:#9FD3FF;--no:#4A6070;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1D29;--card:#16293A;--fg:#E6F0F7;--soft:#A9BFCF;--line:#29404F;--btn:#1E3A52;--btnfg:#9FD3FF;--no:#4A6070;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:'Nunito',system-ui,sans-serif;font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-size:28px;font-weight:900}
h2{margin:0 0 12px;font-size:22px;font-weight:900;text-wrap:balance}
.en{color:var(--soft);font-weight:600}
.lead{color:var(--soft);margin:4px 0 0}
section{display:flex;flex-direction:column;gap:12px}
.page{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.scene{width:100%;max-width:420px;border-radius:12px;display:block}
.tr{font-weight:800;font-size:18px}
.btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.play{background:var(--btn);color:var(--btnfg);border:0;border-radius:999px;padding:6px 14px;font:inherit;font-weight:800;cursor:pointer}
.play:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.play.on{background:var(--accent);color:#fff}
.choices{display:flex;gap:10px;flex-wrap:wrap}
figure{margin:0;width:130px;max-width:30%;border-radius:12px;border:3px solid var(--no);overflow:hidden;background:#fff}
figure.ok{border-color:var(--ok)}
figure img{display:block;width:100%}
figcaption{font-size:13px;font-weight:800;text-align:center;padding:2px;background:var(--card);color:var(--soft)}
figure.ok figcaption{color:var(--ok)}
.result{border-left:3px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.result b{font-size:13px;color:var(--soft)}
</style>
<main>
<header><h1>Hikâye incelemesi</h1><p class="lead">Dört hikâyenin tüm resimleri ve sesleri. Türkçe: İrem (Eleven v4), İngilizce: Laura. Düzeltmek istediğiniz cümleyi ya da resmi yazmanız yeterli.</p></header>
